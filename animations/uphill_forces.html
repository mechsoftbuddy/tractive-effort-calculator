<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script>

(function () {

    "use strict";


    const movingSystem =
        document.getElementById(
            "movingSystem"
        );


    const pauseButton =
        document.getElementById(
            "animPause"
        );


    const resetButton =
        document.getElementById(
            "animReset"
        );


    const status =
        document.getElementById(
            "animStatus"
        );


    let running = true;

    let startTime = null;

    let distance = 0;

    let animationFrame = null;


    const speed = 0.028;

    const travelDistance = 120;

    const angle = 11;


    const riseRatio =
        Math.tan(
            angle * Math.PI / 180
        );


    function animate(timestamp) {


        if (!running) {

            animationFrame = null;

            return;
        }


        if (startTime === null) {

            startTime = timestamp;

        }


        const elapsed =
            timestamp - startTime;


        distance =
            (
                elapsed * speed
            ) % travelDistance;


        /*
         * Moving right = uphill.
         */

        const x =
            distance;


        const y =
            -(distance * riseRatio);


        movingSystem.setAttribute(
            "transform",
            `translate(${x}, ${y})`
        );


        animationFrame =
            requestAnimationFrame(
                animate
            );

    }


    pauseButton.addEventListener(
        "click",
        function () {


            running = !running;


            if (running) {


                pauseButton.textContent =
                    "Pause animation";


                status.textContent =
                    "Vehicle climbing uphill";


                startTime =
                    performance.now()
                    -
                    (
                        distance / speed
                    );


                animationFrame =
                    requestAnimationFrame(
                        animate
                    );


            } else {


                pauseButton.textContent =
                    "Play animation";


                status.textContent =
                    "Animation paused";

            }

        }
    );


    resetButton.addEventListener(
        "click",
        function () {


            distance = 0;

            startTime = null;


            movingSystem.setAttribute(
                "transform",
                "translate(0, 0)"
            );


            status.textContent =
                running
                ? "Vehicle climbing uphill"
                : "Animation paused";

        }
    );


    animationFrame =
        requestAnimationFrame(
            animate
        );


})();

</script>
